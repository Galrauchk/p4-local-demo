name: Aperçu Cloudflare

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: read
  pull-requests: write

concurrency:
  group: apercu-cloudflare-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apercu:
    # Les secrets ne sont pas transmis aux PR venant d'un fork : pas d'apercu dans ce cas.
    if: github.event.pull_request.head.repo.full_name == github.repository && vars.CLOUDFLARE_PREVIEW_ENABLED == 'true'
    runs-on: [self-hosted, vps]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Installer les dépendances
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Construire le site
        run: npm run build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          VISITOR_ACK_ENABLED: "true"
      - name: Traduire les règles Netlify pour Cloudflare
        run: npm run test:cloudflare && npm run cf:check
      - name: Publier la version d'aperçu
        id: version
        run: |
          set -o pipefail
          npx wrangler versions upload --config wrangler.toml \
            --preview-alias "pr-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }} ${GITHUB_SHA::7}" | tee wrangler.log
          url=$(grep -oE 'https://pr-[0-9]+-[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' wrangler.log | head -1)
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Vérifier que l'aperçu est privé et non indexable
        env:
          PREVIEW_URL: ${{ steps.version.outputs.url }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node scripts/verify-cloudflare-preview.mjs
      - name: Afficher l'adresse dans la PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ steps.version.outputs.url }}
        run: |
          corps="<!-- apercu-cloudflare -->
          **Aperçu Cloudflare** : $URL
          Version ${GITHUB_SHA::7}, privée (connexion Cloudflare Access avec contact@webtrafic.fr), non indexable, formulaire désactivé. La production n'est pas touchée."
          id=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --paginate \
            -q '.[] | select(.body | startswith("<!-- apercu-cloudflare -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -f body="$corps" > /dev/null
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body "$corps"
          fi
